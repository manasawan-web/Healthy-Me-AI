<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NextStep AI - ระบบวิเคราะห์และวางแผนสุขภาพส่วนบุคคล</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Kanit', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 100%);
      color: #1e293b;
      min-height: 100vh;
      padding: 30px 15px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 750px;
      background: #ffffff;
      padding: 35px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header h1 {
      color: #0d9488;
      font-size: 2.2rem;
      margin-bottom: 5px;
    }

    .header p {
      color: #64748b;
      font-size: 0.95rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
    }

    .input-group.full-width {
      grid-column: 1 / -1;
    }

    label {
      font-weight: 500;
      font-size: 0.9rem;
      color: #334155;
      margin-bottom: 6px;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      font-size: 0.95rem;
      color: #0f172a;
      background-color: #f8fafc;
      outline: none;
      transition: all 0.2s ease;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #0d9488;
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.15);
    }

    textarea {
      resize: vertical;
      min-height: 70px;
    }

    button.btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #0d9488 0%, #059669 100%);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(13, 148, 136, 0.3);
      transition: all 0.2s ease;
    }

    button.btn-submit:hover {
      background: linear-gradient(135deg, #0f766e 0%, #047857 100%);
      box-shadow: 0 6px 16px rgba(13, 148, 136, 0.4);
    }

    /* Dashboard Metrics Display */
    .metrics-dashboard {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 25px;
      display: none;
    }

    .metric-card {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      padding: 15px;
      border-radius: 12px;
      text-align: center;
    }

    .metric-card .title {
      font-size: 0.85rem;
      color: #166534;
      font-weight: 500;
    }

    .metric-card .value {
      font-size: 1.4rem;
      font-weight: 600;
      color: #0f766e;
      margin: 4px 0;
    }

    .metric-card .subtext {
      font-size: 0.75rem;
      color: #047857;
    }

    /* AI Advice Result Display */
    .result-box {
      margin-top: 20px;
      padding: 22px;
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      border-left: 6px solid #0d9488;
      border-radius: 12px;
      display: none;
      line-height: 1.7;
      color: #334155;
      font-size: 0.95rem;
    }

    .result-box h3 {
      color: #0d9488;
      margin-bottom: 12px;
      font-size: 1.2rem;
      border-bottom: 1px solid #f1f5f9;
      padding-bottom: 8px;
    }

    .result-content {
      white-space: pre-line;
    }

    .btn-print {
      margin-top: 15px;
      background-color: #475569;
      color: white;
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      float: right;
    }

    .btn-print:hover {
      background-color: #334155;
    }

    @media (max-width: 600px) {
      .metrics-dashboard {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🥗NextStep AI</h1>
    <p>ระบบวิเคราะห์สุขภาพ คำนวณพลังงาน และจัดวางแผนโภชนาการส่วนบุคคล</p>
  </div>

  <form id="healthForm">
    <div class="form-grid">
      <div class="input-group">
        <label for="gender">เพศ:</label>
        <select id="gender">
          <option value="male">ชาย</option>
          <option value="female">หญิง</option>
        </select>
      </div>

      <div class="input-group">
        <label for="age">อายุ (ปี):</label>
        <input type="number" id="age" placeholder="เช่น 25" value="25" required>
      </div>

      <div class="input-group">
        <label for="weight">น้ำหนัก (กก.):</label>
        <input type="number" id="weight" placeholder="เช่น 65" required>
      </div>

      <div class="input-group">
        <label for="height">ส่วนสูง (ซม.):</label>
        <input type="number" id="height" placeholder="เช่น 170" required>
      </div>

      <div class="input-group full-width">
        <label for="activity">ระดับการออกกำลังกาย/กิจกรรมประจำวัน:</label>
        <select id="activity">
          <option value="1.2">นั่งทำงานเป็นหลัก / ออกกำลังกายร้อยมากหรือไม่ออกเลย</option>
          <option value="1.375">เบาๆ (ออกกำลังกาย 1-3 วัน/สัปดาห์)</option>
          <option value="1.55">ปานกลาง (ออกกำลังกาย 3-5 วัน/สัปดาห์)</option>
          <option value="1.725">หนัก (ออกกำลังกาย 6-7 วัน/สัปดาห์)</option>
        </select>
      </div>

      <div class="input-group full-width">
        <label for="goal">เป้าหมายด้านสุขภาพ:</label>
        <select id="goal">
          <option value="ลดน้ำหนักอย่างปลอดภัย">ลดน้ำหนัก / ลดไขมัน (Fat Loss)</option>
          <option value="เพิ่มกล้ามเนื้อและน้ำหนัก">เพิ่มกล้ามเนื้อ (Muscle Building)</option>
          <option value="รักษาน้ำหนักและสุขภาพดี">รักษาสุขภาพทั่วไป (Maintenance)</option>
        </select>
      </div>

      <div class="input-group full-width">
        <label for="details">ข้อจำกัดอาหาร / ข้อมูลสุขภาพเพิ่มเติม:</label>
        <textarea id="details" placeholder="เช่น แพ้อาหารทะเล, ทานมังสวิรัติ, มีโรคประจำตัว, มีเวลาออกกำลังกาย 30 นาที/วัน"></textarea>
      </div>
    </div>

    <button type="button" class="btn-submit" onclick="processHealthData()">ประมวลผลวิเคราะห์สุขภาพด้วย AI</button>
  </form>

  <div id="metricsDashboard" class="metrics-dashboard">
    <div class="metric-card">
      <div class="title">ดัชนีมวลกาย (BMI)</div>
      <div class="value" id="bmiVal">0.0</div>
      <div class="subtext" id="bmiStatus">-</div>
    </div>
    <div class="metric-card">
      <div class="title">พลังงานพื้นฐาน (BMR)</div>
      <div class="value" id="bmrVal">0</div>
      <div class="subtext">kcal / วัน</div>
    </div>
    <div class="metric-card">
      <div class="title">พลังงานใช้งาน (TDEE)</div>
      <div class="value" id="tdeeVal">0</div>
      <div class="subtext">kcal / วัน</div>
    </div>
  </div>

  <div id="resultBox" class="result-box">
    <h3>📋 รายงานผลการประเมินและแผนโภชนาการเฉพาะบุคคล</h3>
    <div id="resultContent" class="result-content">กำลังประมวลผล...</div>
    <button class="btn-print" onclick="window.print()">🖨️ พิมพ์รายงาน / บันทึก PDF</button>
  </div>
</div>

<script>
  async function processHealthData() {
    const gender = document.getElementById('gender').value;
    const age = parseFloat(document.getElementById('age').value) || 25;
    const weight = parseFloat(document.getElementById('weight').value);
    const height = parseFloat(document.getElementById('height').value);
    const activityFactor = parseFloat(document.getElementById('activity').value);
    const goal = document.getElementById('goal').value;
    const details = document.getElementById('details').value;

    const metricsDashboard = document.getElementById('metricsDashboard');
    const resultBox = document.getElementById('resultBox');
    const resultContent = document.getElementById('resultContent');

    if (!weight || !height) {
      alert('กรุณากรอกข้อมูลน้ำหนักและส่วนสูงให้ถูกต้อง');
      return;
    }

    // 1. คำนวณดัชนีทางสุขภาพ (BMI, BMR, TDEE)
    const heightM = height / 100;
    const bmi = (weight / (heightM * heightM)).toFixed(1);
    
    // คำนวณ BMR (Mifflin-St Jeor Formula)
    let bmr = (10 * weight) + (6.25 * height) - (5 * age);
    bmr += (gender === 'male') ? 5 : -161;
    bmr = Math.round(bmr);

    // คำนวณ TDEE
    const tdee = Math.round(bmr * activityFactor);

    // ระบุเกณฑ์ BMI (เกณฑ์สำหรับคนเอเชีย)
    let bmiCategory = '';
    if (bmi < 18.5) bmiCategory = 'น้ำหนักต่ำกว่าเกณฑ์';
    else if (bmi < 23.0) bmiCategory = 'น้ำหนักปกติ สมส่วน';
    else if (bmi < 25.0) bmiCategory = 'น้ำหนักเกิน (ท้วม)';
    else if (bmi < 30.0) bmiCategory = 'อ้วนระดับ 1';
    else bmiCategory = 'อ้วนระดับ 2 (อันตราย)';

    // แสดงผลตัวเลขดัชนี
    document.getElementById('bmiVal').innerText = bmi;
    document.getElementById('bmiStatus').innerText = bmiCategory;
    document.getElementById('bmrVal').innerText = bmr.toLocaleString();
    document.getElementById('tdeeVal').innerText = tdee.toLocaleString();
    metricsDashboard.style.display = 'grid';

    // 2. เรียกประมวลผล AI
    resultBox.style.display = 'block';
    resultContent.innerText = '🤖 AI กำลังวิเคราะห์ข้อมูลสุขภาพและจัดตารางโภชนาการสำหรับคุณ...';

    const prompt = `คุณคือผู้เชี่ยวชาญด้านโภชนาการและการออกกำลังกาย (Nutritional & Fitness Expert) 
วิเคราะห์ข้อมูลผู้ใช้งานดังนี้:
- เพศ: ${gender === 'male' ? 'ชาย' : 'หญิง'}, อายุ: ${age} ปี, น้ำหนัก: ${weight} กก., ส่วนสูง: ${height} ซม.
- ค่า BMI: ${bmi} (${bmiCategory}), BMR: ${bmr} kcal, TDEE: ${tdee} kcal
- เป้าหมาย: ${goal}
- ข้อจำกัด/ข้อมูลเพิ่มเติม: ${details || 'ไม่มี'}

กรุณาจัดทำแผนสุขภาพแบบละเอียดสั้นๆ กระชับ และใช้งานได้จริง โดยแบ่งเป็นข้อๆ ดังนี้:
1. [การจัดสรรแคลอรี] แนะนำเป้าหมายแคลอรีต่อวันที่ควรได้รับเพื่อบรรลุเป้าหมาย
2. [ตัวอย่างตารางอาหารประจำวัน] แนะนำเมนูอาหารไทยที่เหมาะสม 3 มื้อ (เช้า, กลางวัน, เย็น)
3. [คำแนะนำการออกกำลังกาย] แนะนำรูปแบบการออกกำลังกายที่เหมาะสมกับระดับปัจจุบัน
4. [ข้อควรระวัง/เทคนิคเพิ่มเติม] คำแนะนำเฉพาะตัวตามข้อมูลจำกัดที่ระบุ`;

    try {
      // ใส่ Gemini API Key ของคุณที่นี่
      const apiKey = 'YOUR_API_KEY_HERE';
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
      });

      const data = await response.json();
      const aiAdvice = data.candidates[0].content.parts[0].text;
      resultContent.innerText = aiAdvice;

    } catch (error) {
      // กรณีไม่มี API Key หรือการเชื่อมต่อมีปัญหา จะแสดงตัวอย่างการวิเคราะห์จำลองเชิงลึก
      let targetCal = tdee;
      if (goal.includes('ลดน้ำหนัก')) targetCal = tdee - 500;
      else if (goal.includes('เพิ่มกล้ามเนื้อ')) targetCal = tdee + 300;

      resultContent.innerText = 
`🎯 1. การจัดสรรพลังงานและสารอาหาร (Calorie & Macronutrients Target)
• พลังงานที่แนะนำต่อวัน: ประมาณ ${targetCal.toLocaleString()} kcal
• สัดส่วนสารอาหารแนะนำ: โปรตีน 30% | คาร์โบไฮเดรต 40% | ไขมันดี 30%

🥗 2. ตัวอย่างตารางเมนูอาหารแนะนำประจำวัน
• มื้อเช้า: อกไก่ต้ม/นึ่ง 150g + ข้าวไรซ์เบอร์รี 1 ทัพพี + ไข่ต้ม 1 ฟอง + ผักสด
• มื้อกลางวัน: เกาเหลาอกไก่/หมูชิ้นไม่เจียวกระเทียม + ข้าวสวย 1 ทัพพี + ผลไม้หวานน้อย (เช่น ฝรั่ง/แอปเปิลเขียว)
• มื้อเย็น: สเต๊กปลาแซลมอนหรืออกไก่ย่าง + สลัดผักน้ำใส + มันนึ่ง 1 หัวเล็ก

🏋️‍♂️ 3. โปรแกรมการออกกำลังกายแนะนำ
• เวทเทรนนิ่ง (Strength Training): 3-4 วัน/สัปดาห์ (เน้นสร้างมวลกล้ามเนื้อ)
• คาร์ดิโอ (Cardio): เดินเร็ว/ปั่นจักรยาน ความเหนื่อยระดับปานกลาง 150 นาที/สัปดาห์

💡 4. ข้อแนะนำเพิ่มเติม
• ดื่มน้ำเปล่าอย่างน้อย 2.5 - 3 ลิตรต่อวัน
• พักผ่อนให้เพียงพอ 7-8 ชั่วโมงต่อคืน เพื่อช่วยระบบเผาผลาญและการซ่อมแซมร่างกาย`;
    }
  }
</script>

</body>
</html>
